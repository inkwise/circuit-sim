apply plugin: 'com.android.application'

android {
    namespace 'com.circuitlab.app'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.circuitlab.app'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.3'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17', '-fexceptions', '-frtti'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ['src/main/jniLibs']
        assets.srcDirs = ['src/main/assets']
    }

    lint {
        abortOnError false
    }
}

dependencies {
}
